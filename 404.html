<!doctype html>
<html lang="fr">
<head>
<base href="/verdict-pilote-test/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilote Verdict">
<link rel="manifest" href="./pilote.webmanifest">
<link rel="apple-touch-icon" href="./icons/verdict-pilote-app-v43-12-180.png">
<title>Verdict Pilote</title>
<style>
:root{--acc:#f5f5f4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#f5f5f4;font:500 16px/1.5 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.box{width:min(380px,100%);text-align:center}
.logo{width:88px;height:88px;border-radius:22px;margin:0 auto 18px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.6)}
h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
p{margin:0 0 22px;color:#a8a29e;font-size:14px}
input{width:100%;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid #3f3f46;background:#111;color:#fff;font-family:inherit;font-size:17px;font-weight:600;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:14px;background:var(--acc);color:#0a0a0a;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}
.err{min-height:22px;margin-top:12px;color:#f87171;font-size:14px}
.note{margin-top:22px;color:#78716c;font-size:12.5px}
</style>
</head>
<body>
<main><form class="box" id="f" autocomplete="on">
  <img class="logo" src="./icons/verdict-pilote-app-v43-12-180.png" alt="">
  <h1>Verdict Pilote</h1>
  <p>Espace privé. Saisissez votre mot de passe : il reste sur cet appareil.</p>
  <input type="text" name="username" value="Pilote Verdict" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
  <button id="go" type="submit">Ouvrir</button>
  <div class="err" id="err" role="alert"></div>
  <div class="note">Vos données sont chiffrées : sans le mot de passe, personne ne peut les lire, même avec l'adresse.</div>
</form></main>
<script>
(function(){
  'use strict';
  var ID='pilote',START='verdict-pilote.html',SW='pilote-sw.js';
  var $=function(i){return document.getElementById(i);};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function meta(){return fetch('./coffre.json',{cache:'no-store'}).then(function(r){return r.json();});}
  function check(m,key){var c=b64(m.check);return crypto.subtle.decrypt({name:'AES-GCM',iv:c.slice(0,12)},key,c.slice(12)).then(function(){return true;},function(){return false;});}
  function worker(){
    if(!('serviceWorker' in navigator))return Promise.reject(new Error('Ce navigateur ne permet pas d’ouvrir l’espace privé.'));
    return navigator.serviceWorker.register('./'+SW,{scope:'./'}).then(function(){return navigator.serviceWorker.ready;});
  }
  function ask(reg,msg){return new Promise(function(res){var ch=new MessageChannel(),t=setTimeout(function(){res(false);},8000);ch.port1.onmessage=function(e){clearTimeout(t);res(e.data);};reg.active.postMessage(msg,[ch.port2]);});}
  function enter(){
    /* La page est maintenant servie déchiffrée par le service worker : on recharge l'adresse de départ. */
    var here=location.href.split('#')[0].split('?')[0],root=new URL('./',document.baseURI).href;
    /* Page de secours (adresse profonde, ex. verdict-pilote.html ouverte depuis l'écran d'accueil) : on recharge
       la même adresse, désormais servie déchiffrée. */
    var to=here!==root&&here!==root+'index.html'?here+location.search:new URL('./'+START,root).href+location.search;
    var n=0;try{n=+sessionStorage.getItem('coffre-essais-'+ID)||0;sessionStorage.setItem('coffre-essais-'+ID,n+1);}catch(e){}
    if(n>=2){try{sessionStorage.removeItem('coffre-essais-'+ID);}catch(e){}$('err').textContent='Ouverture impossible : fermez puis rouvrez l’application.';return;}
    if(to===location.href.split('#')[0])location.reload();else location.replace(to);
  }
  /* Déjà déverrouillé sur cet appareil : on entre directement. */
  worker().then(function(reg){return ask(reg,{type:'etat'});}).then(function(ok){if(ok)enter();}).catch(function(){});
  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();var pw=$('pw').value;if(!pw)return;try{sessionStorage.removeItem('coffre-essais-'+ID);}catch(x){}
    $('go').disabled=true;$('go').textContent='Ouverture…';$('err').textContent='';
    meta().then(function(m){
      return crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']).then(function(base){
        return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(m.salt),iterations:m.iter,hash:'SHA-256'},base,256);
      }).then(function(bits){
        return crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']).then(function(key){
          return check(m,key).then(function(ok){
            if(!ok)throw new Error('mdp');
            return worker().then(function(reg){return ask(reg,{type:'cle',bits:bits});}).then(function(stored){if(!stored)throw new Error('Clé non enregistrée sur cet appareil.');});
          });
        });
      });
    }).then(function(){try{sessionStorage.setItem('coffre-frais-'+ID,'1');}catch(x){}enter();},function(e){
      if(e&&e.message&&e.message!=='mdp'&&!/fetch|réseau|network/i.test(e.message)){$('go').disabled=false;$('go').textContent='Ouvrir';$('err').textContent=e.message;return;}
      $('go').disabled=false;$('go').textContent='Ouvrir';
      $('err').textContent=e&&e.message==='mdp'?'Mot de passe incorrect.':'Connexion impossible, réessayez.';
      $('pw').select();
    });
  });
})();
</script>
</body>
</html>
